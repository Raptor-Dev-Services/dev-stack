# =============================================================================
# compose-dev.yaml - LA infraestructura de desarrollo, compartida por todos los productos
# =============================================================================
# Un solo Postgres, un solo MinIO, un solo Redis, un solo buzon de correo y un solo
# juego de monitoreo (Seq, Prometheus, Grafana, Uptime Kuma) para todos los productos de
# la maquina, en lugar de una instancia de cada cosa por repo peleandose los puertos.
#
#     cp .env.example .env                           # una vez: OBLIGATORIO, ver abajo
#     cp productos.conf.example productos.conf     # una vez: que productos hay
#     docker compose -f compose-dev.yaml up -d       # levanta la infraestructura
#     docker compose -f compose-dev.yaml down        # la baja, conservando los datos
#     docker compose -f compose-dev.yaml down -v     # la baja y BORRA los volumenes
#
# Las APIs NO estan aqui: cada producto las levanta desde su repo (`dotnet run`, o un
# compose propio enganchado a la red `devstack`).
#
# -----------------------------------------------------------------------------
# EL .env ES OBLIGATORIO
# -----------------------------------------------------------------------------
# Ningun puerto, usuario ni contrasena esta escrito en este archivo: todos salen de `.env`
# con la forma `${VAR:?...}`. Si falta el archivo o una variable, `docker compose` se niega
# a arrancar y dice cual falta, en vez de levantar con un valor que nadie eligio. Lo unico
# fijo aqui son las versiones de las imagenes, que son parte del stack y no de la maquina.
#
# -----------------------------------------------------------------------------
# DONDE VIVEN LOS DATOS
# -----------------------------------------------------------------------------
# El monitoreo (Seq, Prometheus, Grafana, Uptime Kuma) guarda en `./data/<servicio>`, junto
# a este archivo: se ve, se respalda copiando la carpeta y `down -v` NO la borra. Para
# empezar de cero un servicio, se baja y se borra su carpeta.
#
# Postgres, MinIO y Redis siguen en volumenes con nombre, a proposito: Postgres exige que su
# directorio de datos sea del usuario `postgres` con permisos 0700, y un bind mount sobre
# una carpeta de Windows no puede cumplirlo (initdb falla o la base corre lenta sobre el
# puente de archivos). Ademas ya tienen las bases de todos los productos: moverlos es una
# migracion con respaldo, no un cambio de una linea.
#
# -----------------------------------------------------------------------------
# POR QUE LOS PUERTOS SON LOS ESTANDAR
# -----------------------------------------------------------------------------
# Con una instancia por producto habia que correr los puertos (5433, 5434, 9010...) para
# no chocar. Con una sola, se vuelve a los de siempre: 5432, 9000, 6379, 1025. Si otro
# contenedor ya tiene el 5432, este no arranca en silencio: `up` falla con el bind. Y una
# conexion a la base equivocada es imposible porque cada producto tiene su propio rol
# (ver init/postgres/00-bases-y-roles.sh).
#
# -----------------------------------------------------------------------------
# DESDE DONDE SE PUEDE ENTRAR: DEVSTACK_BIND
# -----------------------------------------------------------------------------
# Todo puerto se publica en la direccion DEVSTACK_BIND del .env, y no es un detalle: varios
# servicios NO piden credenciales (la ingesta de Seq, el receptor OTLP de Prometheus, Redis,
# Mailpit) y el resto usa contrasenas de desarrollo.
#   127.0.0.1  solo esta maquina. Lo seguro en tu equipo.
#   0.0.0.0    toda la red. Solo detras de un firewall, o con una app movil en un telefono
#              fisico que tenga que llegar a MinIO por la IP de la LAN.
#   <IP>       una interfaz concreta del servidor (la de la VPN o la red privada).
# Las APIs en contenedor NO dependen de esto: hablan con el stack por la red `devstack`.
#
# -----------------------------------------------------------------------------
# LO QUE ESTE ARCHIVO **NO** COMPARTE
# -----------------------------------------------------------------------------
# Servicio de un producto = de ese producto. Los listeners de Stripe no estan aqui: cada
# uno reenvia a UN endpoint con UN secreto de webhook propio, y uno compartido mandaria
# los eventos de cobro de un producto a la API de otro.
# =============================================================================

name: devstack

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 17 - una base por producto
  # ---------------------------------------------------------------------------
  # 17 y no 16: Aurora PostgreSQL corre 17 desde el 1-may-2025, tiene minor LTS y soporte
  # estandar hasta 2030. No 18 todavia: sin minor LTS designada.
  #
  # La version se mueve JUNTO con la que declara cada producto como objetivo. Desarrollar
  # en una mayor mas nueva que la de produccion es el sentido peligroso: algo escrito en
  # local puede no correr en el servidor, y nada lo avisa hasta el despliegue.
  #
  # Un cambio de mayor NO es `down -v` a secas: un postgres nuevo no arranca sobre datos
  # de la mayor anterior. Respalda cada base con `pg_dump -Fc` antes y restaura despues,
  # sobre todo si hay policies de RLS en scripts sueltos, que no vuelven solas.
  postgres:
    image: postgres:17-alpine
    container_name: devstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?falta POSTGRES_SUPERUSER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS:?falta POSTGRES_SUPERPASS en .env}
      # La base del superusuario. Las de los productos las crea el script de init.
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${POSTGRES_PORT:?falta POSTGRES_PORT en .env}:5432"
    volumes:
      - devstack-pg:/var/lib/postgresql/data
      # Solo se ejecuta con el volumen vacio. Para reprovisionar: `down -v` y `up`.
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
      # El directorio entero y no el archivo: si `productos.conf` no existe, montarlo
      # suelto haria que Docker creara un DIRECTORIO con ese nombre, y el init fallaria
      # con un error que no apunta a la causa.
      - ./:/devstack:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:?falta POSTGRES_SUPERUSER en .env} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # MinIO - buckets por producto
  # ---------------------------------------------------------------------------
  #
  # IMAGEN: la oficial de MinIO AIStor, que NECESITA LICENCIA (la gratuita basta). Va en
  # `minio.license`, junto a este archivo, y NO se versiona. Sin licencia valida el
  # servidor arranca en "offline mode", rechaza TODA operacion S3 y `mc ready local` nunca
  # dice listo: el servicio queda `unhealthy` y minio-init no corre. Si lo ves asi, mira
  # `docker logs devstack-minio | grep -i license`.
  #
  # `minio/minio` y `minio/mc` ya no existen en ningun registro (MinIO los retiro en 2025).
  # Alternativa sin licencia: `pgsty/minio:RELEASE.2026-08-04T00-00-00Z`, la build
  # comunitaria del mismo codigo; quita entonces el `--license` del command.
  #
  # Version FIJA: con `latest` una actualizacion de la licencia o del formato de datos
  # llegaria sin aviso en el siguiente pull.
  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    container_name: devstack-minio
    restart: unless-stopped
    command: server /data --console-address ":9001" --license /devstack/minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}
    ports:
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${MINIO_API_PORT:?falta MINIO_API_PORT en .env}:9000"
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${MINIO_CONSOLE_PORT:?falta MINIO_CONSOLE_PORT en .env}:9001"
    volumes:
      - devstack-minio:/data
      # El directorio y no el archivo suelto: si minio.license no existe, montarlo solo
      # haria que Docker creara un DIRECTORIO con ese nombre.
      - ./:/devstack:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Crea los buckets y se apaga. No es un servicio: es un paso de provisioning.
  #
  # Usa la MISMA imagen que el servidor, que ya trae `mc` y `sh`: una sola descarga, y
  # no depende de una imagen de `mc` aparte. Ojo: NO trae grep, awk ni sed; el script
  # de buckets esta escrito en sh puro por eso.
  minio-init:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    container_name: devstack-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?falta MINIO_ROOT_PASSWORD en .env}
    volumes:
      - ./init/minio:/init:ro
      - ./:/devstack:ro
    entrypoint: ["/bin/sh", "/init/crear-buckets.sh"]
    # No reintentar: si falla, `docker compose logs minio-init` dice por que. Con
    # restart, el error se pierde en un bucle y los buckets siguen sin crearse.
    restart: "no"

  # ---------------------------------------------------------------------------
  # Redis - una base logica por producto
  # ---------------------------------------------------------------------------
  # Las bases logicas de Redis NO son un aislamiento de verdad: `FLUSHALL` las borra
  # todas y no hay permisos por base. Bastan en desarrollo; en produccion cada producto
  # tiene su propia instancia.
  redis:
    image: redis:7-alpine
    container_name: devstack-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${REDIS_PORT:?falta REDIS_PORT en .env}:6379"
    volumes:
      - devstack-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------
  # Mailpit - el correo saliente de TODOS los productos, que no sale a internet
  # ---------------------------------------------------------------------------
  # Todos caen en la MISMA bandeja (MAILPIT_WEB_PORT) y se distinguen por el remitente.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: devstack-mailpit
    restart: unless-stopped
    ports:
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${MAILPIT_SMTP_PORT:?falta MAILPIT_SMTP_PORT en .env}:1025"
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${MAILPIT_WEB_PORT:?falta MAILPIT_WEB_PORT en .env}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ===========================================================================
  # MONITOREO
  # ===========================================================================
  # Cada pieza responde una pregunta distinta, y ninguna sustituye a otra:
  #   Seq          -> que paso (logs estructurados de cada request)
  #   Prometheus   -> cuanto y que tan rapido (metricas en serie de tiempo)
  #   Grafana      -> verlo junto (tableros sobre Prometheus)
  #   Uptime Kuma  -> esta arriba o no (sondeo de /health de cada API)

  # ---------------------------------------------------------------------------
  # permisos-init - deja ./data con el dueno que cada imagen espera, y se apaga
  # ---------------------------------------------------------------------------
  # Prometheus corre como `nobody` (65534) y Grafana como 472. En Linux, si Docker crea
  # `data/prometheus` o `data/grafana` al primer `up`, las crea como root y ninguno de los dos
  # puede escribir: Prometheus sale con `permission denied` y el `up` termina en
  # "dependency failed to start: container devstack-prometheus is unhealthy". En Windows y
  # macOS no se ve, porque el puente de archivos no aplica esos permisos.
  #
  # Corre en cada `up` y es idempotente. Seq y Uptime Kuma corren como root y no lo necesitan.
  permisos-init:
    image: busybox:1.37.0
    container_name: devstack-permisos-init
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /data/prometheus /data/grafana /data/seq /data/uptime-kuma &&
        chown -R 65534:65534 /data/prometheus &&
        chown -R 472:0 /data/grafana &&
        echo "==> permisos de data/ listos"
    volumes:
      - ./data:/data
    restart: "no"

  # ---------------------------------------------------------------------------
  # Seq - logs estructurados
  # ---------------------------------------------------------------------------
  # Dos puertos, y no son intercambiables:
  #   SEQ_INGESTION_PORT -> 5341 del contenedor: SOLO ingesta. Es el que ya usan los
  #                         productos (`Seq__ServerUrl=http://localhost:5341`), asi que no
  #                         cambia nada para ellos.
  #   SEQ_UI_PORT        -> 80 del contenedor: la interfaz web, con login.
  # Desde otro contenedor de la red `devstack`, la ingesta es `http://seq:5341`.
  #
  # La contrasena de `admin` solo se aplica en el PRIMER arranque (carpeta de datos vacia).
  # Cambiarla despues en `.env` no hace nada: se cambia desde la interfaz.
  seq:
    image: datalust/seq:2026.1.17182
    container_name: devstack-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINUSERNAME: ${SEQ_ADMIN_USER:?falta SEQ_ADMIN_USER en .env}
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?falta SEQ_ADMIN_PASSWORD en .env}
    ports:
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${SEQ_UI_PORT:?falta SEQ_UI_PORT en .env}:80"
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${SEQ_INGESTION_PORT:?falta SEQ_INGESTION_PORT en .env}:5341"
    volumes:
      - ./data/seq:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Prometheus - metricas
  # ---------------------------------------------------------------------------
  # Las APIs NO exponen /metrics: desde Common v2.1 EMPUJAN sus metricas por OTLP al
  # receptor de Prometheus, que por eso va encendido (`--web.enable-otlp-receiver`). En el
  # producto basta con:
  #     Observability__MetricsOtlpEndpoint=http://localhost:9090/api/v1/otlp/v1/metrics
  # (o `http://prometheus:9090/...` si la API corre en un contenedor de la red `devstack`).
  #
  # La configuracion vive en `prometheus/prometheus.yml`, versionada. El puerto de la
  # interfaz es el que se publica; dentro del contenedor siempre es 9090.
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: devstack-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:?falta PROMETHEUS_RETENTION en .env}"
      - "--web.enable-otlp-receiver"
    depends_on:
      permisos-init:
        condition: service_completed_successfully
    # Para alcanzar lo que corre en la maquina y no en Docker (una API con `dotnet run`,
    # un node_exporter). En Docker Desktop ya existe; en Linux hace falta declararlo.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${PROMETHEUS_PORT:?falta PROMETHEUS_PORT en .env}:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - ./data/prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Grafana - tableros
  # ---------------------------------------------------------------------------
  # La fuente de datos de Prometheus llega sola por provisioning (`grafana/provisioning`,
  # versionado): un clon limpio abre Grafana ya conectado, sin configurar nada a mano.
  #
  # Usuario y contrasena de admin, igual que Seq: solo aplican en el PRIMER arranque.
  grafana:
    image: grafana/grafana:13.2.3
    container_name: devstack-grafana
    restart: unless-stopped
    depends_on:
      permisos-init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?falta GRAFANA_ADMIN_USER en .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?falta GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${GRAFANA_PORT:?falta GRAFANA_PORT en .env}:3000"
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Uptime Kuma - esta arriba o no
  # ---------------------------------------------------------------------------
  # Sondea el /health de cada API y avisa cuando cae. El usuario administrador se crea en
  # el asistente del primer arranque, en la interfaz: Kuma no lo acepta por variable.
  #
  # Los monitores se dan de alta en la interfaz y viven en `./data/uptime-kuma`. Una API
  # que corre con `dotnet run` se sondea como `http://host.docker.internal:<puerto>/...`;
  # una en contenedor de la red `devstack`, por su nombre de servicio.
  #
  # El healthcheck lo trae la imagen.
  uptime-kuma:
    image: louislam/uptime-kuma:2.5.5
    container_name: devstack-uptime-kuma
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${UPTIME_KUMA_PORT:?falta UPTIME_KUMA_PORT en .env}:3001"
    volumes:
      - ./data/uptime-kuma:/app/data

  # ---------------------------------------------------------------------------
  # Dashy - la pagina de inicio: un link a cada cosa del stack y de los productos
  # ---------------------------------------------------------------------------
  # No guarda datos: su conf.yml se GENERA en cada arranque desde dashy/conf.template.yml
  # (versionado) mas dashy/productos.yml (local, no versionado), con el host y los puertos
  # de este .env. Asi el mismo archivo sirve en tu maquina y en el servidor. La edicion desde
  # la interfaz esta apagada porque se perderia al reiniciar. Ver dashy/arrancar.sh.
  #
  # DEVSTACK_HOST es el nombre con el que el NAVEGADOR llega a esta maquina (localhost en tu
  # equipo, el nombre o IP del servidor en staging), no un nombre de la red de Docker.
  dashy:
    image: lissy93/dashy:4.7.10
    container_name: devstack-dashy
    restart: unless-stopped
    entrypoint: ["/sbin/tini", "--", "/bin/sh", "/dashy-init/arrancar.sh"]
    environment:
      DEVSTACK_HOST: ${DEVSTACK_HOST:?falta DEVSTACK_HOST en .env}
      GRAFANA_PORT: ${GRAFANA_PORT:?falta GRAFANA_PORT en .env}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:?falta PROMETHEUS_PORT en .env}
      SEQ_UI_PORT: ${SEQ_UI_PORT:?falta SEQ_UI_PORT en .env}
      UPTIME_KUMA_PORT: ${UPTIME_KUMA_PORT:?falta UPTIME_KUMA_PORT en .env}
      MINIO_CONSOLE_PORT: ${MINIO_CONSOLE_PORT:?falta MINIO_CONSOLE_PORT en .env}
      MAILPIT_WEB_PORT: ${MAILPIT_WEB_PORT:?falta MAILPIT_WEB_PORT en .env}
    ports:
      - "${DEVSTACK_BIND:?falta DEVSTACK_BIND en .env}:${DASHY_PORT:?falta DASHY_PORT en .env}:8080"
    volumes:
      - ./dashy:/dashy-init:ro
    # La sonda de la imagen corre cada 5 minutos: un Dashy caido tardaria eso en verse.
    healthcheck:
      test: ["CMD-SHELL", "node services/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  devstack-pg:
  devstack-minio:
  devstack-redis:

# Red con nombre fijo para que el compose de cada producto pueda engancharse a ella como
# externa. Sin `name:`, Compose la llamaria `devstack_default` y cada repo tendria que
# adivinar ese nombre derivado. El monitoreo va en la MISMA red: asi Prometheus, Kuma y
# Seq alcanzan a las APIs en contenedor por su nombre, y ellas a ellos.
networks:
  default:
    name: devstack
